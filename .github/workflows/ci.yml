name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:secrets
      # Production dependencies: fail on critical advisories (a known high one in Next's bundled
      # PostCSS has no non-breaking fix yet and is tracked by Dependabot).
      - run: npm audit --omit=dev --audit-level=critical
